  <text x="250" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="64" font-weight="700" fill="#f8fafc">reclaim<tspan fill="#34d399">_</tspan></text>
  <text x="252" y="160" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#cbd5e1">Find and safely clean reclaimable dev-machine data.</text>
