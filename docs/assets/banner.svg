      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <g transform="translate(70 62)">
    <rect width="136" height="136" rx="30" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <rect x="26" y="88" width="84" height="12" rx="6" fill="#334155"/>
    <rect x="26" y="88" width="30" height="12" rx="6" fill="url(#bar)"/>
    <rect x="26" y="62" width="84" height="12" rx="6" fill="#334155"/>
    <rect x="26" y="62" width="56" height="12" rx="6" fill="url(#bar)" opacity=".8"/>
    <rect x="26" y="36" width="84" height="12" rx="6" fill="#334155"/>
