    <rect x="326" y="184" width="118" height="26" rx="13" fill="#78350f"/><text x="385" y="202" text-anchor="middle" fill="#fcd34d">regenerable</text>
    <rect x="454" y="184" width="64" height="26" rx="13" fill="#7f1d1d"/><text x="486" y="202" text-anchor="middle" fill="#fca5a5">data</text>
