[project]
name = "reclaim"
version = "0.1.0"
description = "Interactive TUI that finds and safely cleans reclaimable dev-machine data on macOS"
requires-python = ">=3.11"
dependencies = ["textual>=0.86"]

[project.scripts]
reclaim = "reclaim.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reclaim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
