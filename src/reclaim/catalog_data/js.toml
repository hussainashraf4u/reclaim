[[item]]
id = "npm-cache"
label = "npm cache"
group = "JavaScript"
path = "~/.npm/_cacache"
risk = "safe"
why = "Downloaded tarballs; re-fetched on demand."
clean = { run = ["npm", "cache", "clean", "--force"] }
needs = "npm"

[[item]]
id = "npm-logs"
label = "npm logs"
group = "JavaScript"
path = "~/.npm/_logs"
risk = "safe"
why = "Old npm debug logs."

[[item]]
id = "pnpm-store"
label = "pnpm store"
group = "JavaScript"
path = "~/Library/pnpm/store"
risk = "safe"
why = "Content-addressable package store; re-fetched on demand."
clean = { run = ["pnpm", "store", "prune"] }
needs = "pnpm"

[[item]]
id = "yarn-cache"
label = "Yarn cache"
group = "JavaScript"
path = "~/Library/Caches/Yarn"
risk = "safe"
why = "Yarn v1 package cache."

[[item]]
