[[item]]
id = "pub-cache-hosted"
label = "Dart pub cache (hosted)"
group = "Flutter and Android"
path = "~/.pub-cache/hosted"
risk = "regenerable"
why = "Hosted packages; next 'pub get' downloads them again. Globally activated tools in bin/ are kept."

[[item]]
id = "pub-cache-git"
label = "Dart pub cache (git)"
group = "Flutter and Android"
path = "~/.pub-cache/git"
risk = "regenerable"
why = "Git dependencies; re-cloned on next 'pub get'."

[[item]]
id = "gradle-caches"
label = "Gradle caches"
group = "Flutter and Android"
path = "~/.gradle/caches"
risk = "regenerable"
why = "Dependency and build caches; first build after removal is slow."

[[item]]
id = "gradle-dists"
label = "Gradle wrapper distributions"
group = "Flutter and Android"
path = "~/.gradle/wrapper/dists"
risk = "regenerable"
why = "Downloaded Gradle versions; the wrapper fetches the one a project needs."

[[item]]
id = "cocoapods"
label = "CocoaPods cache"
group = "Xcode"
path = "~/Library/Caches/CocoaPods"
risk = "safe"
why = "Downloaded pod sources."

[[item]]
id = "xcode-derived"
label = "Xcode DerivedData"
group = "Xcode"
glob = "~/Library/Developer/Xcode/DerivedData/*"
risk = "safe"
why = "Build products and indexes; rebuilt on demand."
busy = ["Xcode"]

[[item]]
id = "xcode-archives"
label = "Xcode Archives"
group = "Xcode"
glob = "~/Library/Developer/Xcode/Archives/*"
risk = "data"
why = "App archives; symbols for released builds may live here."
busy = ["Xcode"]

[[item]]
id = "ios-devicesupport"
label = "iOS DeviceSupport"
group = "Xcode"
glob = "~/Library/Developer/Xcode/iOS DeviceSupport/*"
risk = "regenerable"
why = "Symbols copied from connected devices; re-created when you plug one in."

[[item]]
id = "coresim-caches"
label = "CoreSimulator caches"
group = "Xcode"
path = "~/Library/Developer/CoreSimulator/Caches"
risk = "safe"
why = "Simulator dyld caches."

[[item]]
id = "fastlane"
label = "fastlane cache"
group = "Xcode"
path = "~/.fastlane"
risk = "regenerable"
why = "fastlane caches and spaceship session cookies; removing it forces an App Store Connect re-login with 2FA."

[[item]]
id = "fvm-cache"
label = "FVM git cache"
group = "Flutter and Android"
path = "~/fvm/cache.git"
risk = "regenerable"
why = "Mirror of the Flutter repository used by fvm; re-cloned on next 'fvm install'."

[[item]]
id = "xcode-previews"
label = "Xcode SwiftUI previews"
group = "Xcode"
path = "~/Library/Developer/Xcode/UserData/Previews"
risk = "safe"
why = "Generated SwiftUI preview data; Xcode rebuilds it when a preview is opened."
busy = ["Xcode"]

[[item]]
id = "watchos-devicesupport"
label = "watchOS DeviceSupport"
group = "Xcode"
glob = "~/Library/Developer/Xcode/watchOS DeviceSupport/*"
risk = "regenerable"
why = "Debug symbols copied from a paired watch; Xcode re-creates them on next connect."
busy = ["Xcode"]

[[item]]
id = "tvos-devicesupport"
label = "tvOS DeviceSupport"
group = "Xcode"
glob = "~/Library/Developer/Xcode/tvOS DeviceSupport/*"
risk = "regenerable"
why = "Debug symbols copied from an Apple TV; Xcode re-creates them on next connect."
busy = ["Xcode"]

[[item]]
id = "swiftpm-cache"
label = "Swift Package Manager cache"
group = "Xcode"
path = "~/Library/Caches/org.swift.swiftpm"
risk = "regenerable"
why = "Cloned package repositories and manifests; re-fetched on next resolve."

[[item]]
id = "gradle-daemon-logs"
label = "Gradle daemon logs"
group = "Flutter and Android"
path = "~/.gradle/daemon"
risk = "safe"
why = "Daemon logs and registry; Gradle recreates them. Stop daemons first if one is running."
busy = ["java"]
